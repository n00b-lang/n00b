# Phase 1 CI: build gate.
#
# Scope is deliberately narrow: COMPILE everything on Linux and macOS --
# libn00b, the tools, and all ~470 test binaries -- but do NOT run the suite.
#
# Building with -Dbuild_tests=true is load-bearing, not incidental. It is what
# defines N00B_DEBUG (meson.build: `conf_debug = enable_debug or
# n00b_build_tests`), and several test sources call debug-only surface --
# planner work counters, index introspection -- that is compiled out otherwise.
# Building test targets individually via `ninja <target>` WITHOUT that option
# produces a pile of bogus "undeclared identifier" errors. Use the option, or
# ./build.sh --build-tests.
#
# The gate builds everything and fails on any error. n00b#237 (n00b/n00b_dev
# failing to link on _n00b_crt_main) turned out NOT to reproduce here: it was an
# artifact of a stale local ncc, and a clean checkout building ncc at the pin
# links all 1774 targets. The temporary keep-going + known-broken-assertion
# scaffolding is gone with it.
#
# Three tests fail or hang on main (n00b#234, #235, #236) and are quarantined in
# meson.build, so the suite is otherwise green -- running it is Phase 2. #234 is
# a genuine hang, so it sits in a 'known-broken' suite rather than being marked
# should_fail (meson reports a timeout as TIMEOUT regardless of should_fail).
#
# See the PR that introduced this file for the full staging plan.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete; don't burn runners on it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # Report both platforms on every run. Linux and macOS diverge in exactly
      # the areas this codebase keeps finding bugs in (raw-clone workers, TLS,
      # libc interposition), so a Linux-only failure must not hide a macOS one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ncc needs Clang 22.1.0+ for C23 #embed / --embed-dir (see ncc/README.md).
      # Neither runner image ships one: ubuntu-latest is older, and macOS has
      # Apple clang, which reports 21.x and is NOT sufficient.
      - name: Install Clang 22 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo ln -sf /usr/bin/clang-22 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-22 /usr/bin/clang++
          clang --version

      - name: Install Clang 22 (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install build tooling
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade --break-system-packages 'meson>=1.6.0' || \
            python3 -m pip install --upgrade 'meson>=1.6.0'
          # libgit2 is the one HARD system dependency: meson.build errors out
          # at setup without it (every other optional dep degrades gracefully
          # via required: false). zlib is used for HTTP content decompression.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              ninja-build pkg-config zlib1g-dev cmake
          else
            # Homebrew currently ships 1.9.x, which is new enough (see below).
            brew install ninja pkg-config libgit2 zlib
          fi
          meson --version
          ninja --version

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          # Fail early and loudly rather than deep inside the n00b compile with
          # an inscrutable #embed error.
          ver=$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p' | head -1)
          echo "clang major: ${ver}"
          if [ -z "${ver}" ] || [ "${ver}" -lt 22 ]; then
            echo "::error::ncc requires Clang 22.1.0+; found: $(clang --version | head -1)"
            exit 1
          fi

      # build.sh clones crashappsec/ncc into subprojects/ncc at NCC_REV and
      # builds it. That is the slow part of a cold build, and it only changes
      # when the pin in build.sh changes -- so key the cache on that pin.
      - name: Resolve ncc pin
        id: ncc
        shell: bash
        run: |
          set -euo pipefail
          rev=$(sed -n 's/^NCC_REV_DEFAULT="\(.*\)"$/\1/p' build.sh | head -1)
          if [ -z "${rev}" ]; then
            echo "::error::could not parse NCC_REV_DEFAULT from build.sh"
            exit 1
          fi
          echo "rev=${rev}" >> "$GITHUB_OUTPUT"
          echo "ncc pin: ${rev}"

      - name: Cache ncc build
        id: ncc-cache
        uses: actions/cache@v4
        with:
          path: subprojects/ncc
          key: ncc-${{ runner.os }}-${{ steps.ncc.outputs.rev }}

      # meson.build asks for libgit2 >= 1.7.0, but src/naudit/blame.c actually
      # uses 1.9+ blame APIs (git_blame_hunkcount / _hunk_byindex / _hunk_byline)
      # with no version guard -- so a 1.7 libgit2 configures fine and then fails
      # to compile. That mismatch is n00b#240. ubuntu-latest (24.04) ships 1.7.2,
      # so build a new-enough libgit2 from source rather than block this gate on
      # that decision. macOS takes Homebrew's 1.9.x and needs none of this.
      #
      # DROP THIS STEP once #240 is resolved and apt's libgit2 suffices (or the
      # call sites gain version guards).
      - name: Build libgit2 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ver=1.9.4
          curl -fsSL "https://github.com/libgit2/libgit2/archive/refs/tags/v${ver}.tar.gz" \
            -o /tmp/libgit2.tar.gz
          tar -xzf /tmp/libgit2.tar.gz -C /tmp
          cmake -S "/tmp/libgit2-${ver}" -B /tmp/libgit2-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_CLI=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/libgit2-build -j"$(nproc)"
          sudo cmake --install /tmp/libgit2-build
          sudo ldconfig
          pkg-config --modversion libgit2

      # build.sh has a top-level guard that hard-errors when ncc is absent
      # ("ncc not found. n00b must be built with ncc, not clang."). That guard
      # runs BEFORE ensure_ncc's build-from-subproject fallback, so the
      # fallback is unreachable on a runner with no ncc -- we have to build it
      # ourselves and hand the path over via NCC_PATH.
      - name: Build ncc
        if: steps.ncc-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf subprojects/ncc
          git clone https://github.com/crashappsec/ncc.git subprojects/ncc
          git -C subprojects/ncc checkout "${{ steps.ncc.outputs.rev }}"
          CC=clang meson setup --buildtype=release \
            subprojects/ncc/build_release subprojects/ncc
          meson compile -C subprojects/ncc/build_release
          test -x subprojects/ncc/build_release/ncc

      - name: Build
        shell: bash
        env:
          # meson.build has a VCS guard that refuses to configure outside a jj
          # workspace (it has caught real stale-checkout builds). actions/checkout
          # produces a git checkout with no .jj, so the guard MUST be overridden
          # here or setup fails before compiling anything. The option's own
          # description names "CI checkouts with no .jj" as the intended use.
          N00B_SKIP_VCS_CHECK: "1"
          # Compile the tests (see header: this also sets N00B_DEBUG), but do
          # not run them -- that is Phase 2.
          N00B_BUILD_TESTS: "1"
          N00B_TEST: "0"
          N00B_UNICODE_ALLOW_DOWNLOADS: "1"
          # Explicit, because build.sh's own guard pre-empts its bootstrap path.
          NCC_PATH: ${{ github.workspace }}/subprojects/ncc/build_release/ncc
        run: bash build.sh
